name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 26（液态玻璃需要 iOS 26 SDK）
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            echo "未找到 Xcode 26，回退到 $XCODE"
          fi
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project AIChat.xcodeproj \
            -scheme AIChat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -80

      - name: 打包成 IPA（ad-hoc 签名）
        run: |
          APP="build/Build/Products/Release-iphoneos/AIChat.app"
          ls -la "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - --timestamp=none Payload/AIChat.app || echo "ad-hoc 签名失败，仍继续打包"
          codesign -dv Payload/AIChat.app 2>&1 || true
          zip -qry AIChat-unsigned.ipa Payload
          ls -lh AIChat-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-ipa
          path: AIChat-unsigned.ipa
          retention-days: 7
          if-no-files-found: error